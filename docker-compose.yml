# SAP Hardware: website + admin + PostgreSQL, as one self-contained Coolify project.
# No host ports are published, so it cannot collide with anything else on the server;
# Coolify's proxy (Traefik) routes the domain to the `web` service on port 8000.
services:
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sap:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/sap
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@saphardware.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:-}
      DATA_DIR: /data
    volumes:
      - sap_uploads:/data
    expose:
      - "8000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sap
      POSTGRES_DB: sap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - sap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sap -d sap"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sap_pgdata:
  sap_uploads:
